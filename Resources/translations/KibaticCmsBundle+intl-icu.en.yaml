    crumb: New block
    title: 'New {type} block'

edit:
    updated: 'Updated {date}'
    translations: Translations
    side_by_side: Side by side
    by_slug: Every translation of this block, each saved on its own.

# Shown on the site's pages to the CMS admins, in place of a block that does not exist
missing_block: 'CMS block <b>"{slug}"</b> does not exist, <a href="{url}">create it</a>.'

editor:
    alignment: Text alignment
