    delete: Supprimer
    delete_confirm: Supprimer ce snapshot ? Les blocs ne changent pas.
    exit_preview: Quitter l'aperçu
    banner: 'Aperçu, pour vous seulement, du snapshot'
    in_snapshot: Dans le snapshot
    now: Maintenant
    no_block: Ce snapshot ne contient aucun bloc.
    status:
        modified: Modifiés
        added: Ajoutés
        removed: Supprimés
        unchanged: Inchangés
    row_status:
        modified: Modifié
        added: Ajouté
        removed: Supprimé
        unchanged: Inchangé
    status_help:
        modified: depuis le snapshot, remis comme avant par une restauration
