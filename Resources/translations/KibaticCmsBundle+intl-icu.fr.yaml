    take_publish: Enregistrer et publier
    name: Nom (facultatif)
    name_placeholder: ex. Avant la refonte de l'été
    unnamed: Version
    before_restore: 'Avant la restauration de « {name} »'
    column:
        name: Nom
        date: Date
        blocks: Blocs
        size: Taille
    size: '{size, number} Ko'
    details: Détails
