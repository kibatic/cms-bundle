    name: Nom (facultatif)
    name_placeholder: ex. Avant la refonte de l'été
    unnamed: Snapshot
    before_restore: 'Avant la restauration de « {name} »'
    column:
        name: Nom
        date: Date
        blocks: Blocs
        size: Taille
    size: '{size, number} Ko'
    details: Détails
    preview: Aperçu
    preview_help: Affiche le site avec les blocs de ce snapshot, pour vous seulement
    previewing: En aperçu
    restore: Restaurer
