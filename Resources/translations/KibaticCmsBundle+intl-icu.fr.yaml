        live_help: Aucune version n'est publiée, chaque modification est visible tout de suite. Publiez une version pour choisir ce que voient les visiteurs.
        version: 'Site public : version'
        version_help: 'Publiée le {date}. Les modifications faites depuis forment un brouillon, pas en ligne : publiez-le pour les mettre en ligne.'
    draft:
        name: Brouillon
        unpublished: Non publié
        date: Modifications en cours
        changes: '{count, plural, one {# modification non publiée} other {# modifications non publiées}}'
        see_changes: Changements
        banner: '{count, plural, one {Aperçu du brouillon : # modification pas encore publiée. Les visiteurs voient} other {Aperçu du brouillon : # modifications pas encore publiées. Les visiteurs voient}}'
