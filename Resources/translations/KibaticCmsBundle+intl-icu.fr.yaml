    preview_help: Affiche le site avec les blocs de cette version, pour vous seulement
    previewing: En aperçu
    published: Publiée
    publish: Publier
    publish_help: Le site affichera les blocs de cette version, quelles que soient les modifications faites depuis
    publish_confirm: Publier ? Le site affichera les blocs de cette version ; vos prochaines modifications ne seront pas en ligne avant la prochaine publication.
    unpublish: Dépublier
    unpublish_confirm: Dépublier ? Le site affichera les blocs actuels, avec toutes les modifications faites depuis.
    restore: Restaurer
    restore_help: Remet les blocs de cette version dans l'admin, pour les modifier
