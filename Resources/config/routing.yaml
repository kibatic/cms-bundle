cms_block_index:
    path: /cms
    controller: Kibatic\CmsBundle\Controller\BlockController::index
    methods: GET

cms_block_show:
    path: /cms/block/{slug}/show
    controller: Kibatic\CmsBundle\Controller\BlockController::show
    methods: GET

cms_block_new:
    path: /block/{typeName}/new
    controller: Kibatic\CmsBundle\Controller\BlockController::new
    methods: GET|POST

cms_block_edit:
    path: /cms/block/{id}/edit
    controller: Kibatic\CmsBundle\Controller\BlockController::edit
    methods: GET|POST
    requirements:
        id: '\d+'

cms_block_edit_by_slug:
    path: /cms/block/{slug}/edit
    controller: Kibatic\CmsBundle\Controller\BlockController::editBySlug
    methods: GET|POST

cms_block_delete:
    path: /cms/block/{id}/delete
    controller: Kibatic\CmsBundle\Controller\BlockController::delete
    # POST: http_method_override is off by default since Symfony 7
    methods: POST|DELETE

cms_block_debug:
    path: /cms/debug
    controller: Kibatic\CmsBundle\Controller\BlockController::debug
    methods: GET

cms_chat:
    path: /cms/assistant
    controller: Kibatic\CmsBundle\Controller\ChatController::index
    methods: GET

cms_chat_message:
    path: /cms/assistant/message
    controller: Kibatic\CmsBundle\Controller\ChatController::message
    methods: POST

cms_chat_reset:
    path: /cms/assistant/reset
    controller: Kibatic\CmsBundle\Controller\ChatController::reset
    methods: POST

cms_snapshot_index:
    path: /cms/snapshots
    controller: Kibatic\CmsBundle\Controller\SnapshotController::index
    methods: GET

cms_snapshot_create:
    path: /cms/snapshots
    controller: Kibatic\CmsBundle\Controller\SnapshotController::create
    methods: POST

cms_snapshot_preview_exit:
    path: /cms/snapshots/preview/exit
    controller: Kibatic\CmsBundle\Controller\SnapshotController::exitPreview
    methods: POST

cms_snapshot_show:
    path: /cms/snapshots/{id}
    controller: Kibatic\CmsBundle\Controller\SnapshotController::show
    methods: GET
    requirements:
        id: '\d+'

cms_snapshot_restore:
    path: /cms/snapshots/{id}/restore
    controller: Kibatic\CmsBundle\Controller\SnapshotController::restore
    methods: POST
    requirements:
        id: '\d+'

cms_snapshot_delete:
    path: /cms/snapshots/{id}/delete
    controller: Kibatic\CmsBundle\Controller\SnapshotController::delete
    methods: POST
    requirements:
        id: '\d+'

cms_snapshot_preview:
    path: /cms/snapshots/{id}/preview
    controller: Kibatic\CmsBundle\Controller\SnapshotController::preview
    methods: POST
    requirements:
        id: '\d+'
