services:
    _defaults:
        autowire: true
        autoconfigure: true # virer ?
        public: false

    Kibatic\CmsBundle\Controller\BlockController:
        tags: ['controller.service_arguments']

    # Assistant (Symfony AI): its agent is set by KibaticCmsExtension, its tools are in ai.yaml
    Kibatic\CmsBundle\Controller\ChatController:
        tags: ['controller.service_arguments']

    Kibatic\CmsBundle\Ai\BlockChanges: ~

    Kibatic\CmsBundle\Controller\UploadController:
        tags: ['controller.service_arguments']

    Kibatic\CmsBundle\Upload\ImageStorage: ~
    Kibatic\CmsBundle\Command\CleanUploadsCommand: ~

    Kibatic\CmsBundle\Controller\VersionController:
        tags: ['controller.service_arguments']

    Kibatic\CmsBundle\Repository\VersionRepository: ~
    Kibatic\CmsBundle\Version\Versions: ~
    Kibatic\CmsBundle\Version\VersionPreview: ~
    Kibatic\CmsBundle\Version\PreviewBannerListener: ~

    Kibatic\CmsBundle\Form\TextBlockType: ~
    Kibatic\CmsBundle\Form\ImageBlockType: ~
    Kibatic\CmsBundle\Form\HtmlBlockType: ~
    Kibatic\CmsBundle\Form\AlertBlockType: ~

    _instanceof:
        Kibatic\CmsBundle\Form\BlockTypeInterface:
            tags: [ 'cms.block_type' ]

    Kibatic\CmsBundle\Repository\BlockRepository:
#        class: Kibatic\CmsBundle\Repository\BlockRepository
#        factory: ['@doctrine.orm.entity_manager', 'getRepository']
#        arguments:
#            - Kibatic\CmsBundle\Entity\Block

    Kibatic\CmsBundle\BlockTypeChain:

    Kibatic\CmsBundle\Twig\BlockExtension:
        public: true
        tags:
            - { name: twig.extension }
